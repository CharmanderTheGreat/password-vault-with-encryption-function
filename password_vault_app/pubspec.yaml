name: password_vault_app
description: Offline, encrypted password manager (mobile + desktop) built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local storage (offline only, no network calls)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3      # needed for desktop (Windows/Linux/macOS) SQLite support
  path_provider: ^2.1.3
  path: ^1.9.0

  # Encryption
  cryptography: ^2.7.0            # AES-256-GCM + Argon2id key derivation
  # (cryptography package is pure-Dart, works on all platforms, no native build step needed)

  # Secure random for password generation & salts
  # (uses dart:math Random.secure(), no extra package required)

  # State management
  provider: ^6.1.2

  # Stores non-secret metadata (salt, verifier) — NOT the master password itself
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
